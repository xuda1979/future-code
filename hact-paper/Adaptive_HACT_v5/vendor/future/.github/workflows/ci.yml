name: control-plane-verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation .
      - run: python scripts/check_source.py
      - run: python -m pytest -q --cov=future_code --cov-branch --junitxml=junit.xml
      - run: python examples/demo.py --output /tmp/future-control-ci-demo
      - run: python examples/hierarchy_demo.py --output /tmp/future-control-ci-hierarchy --leaves 64 --workers 16
# Template not executed on hosted CI in this delivery. Review/pin action revisions
# according to your organization policy before treating it as a trusted release gate.
