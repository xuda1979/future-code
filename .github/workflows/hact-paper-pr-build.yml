name: build-hact-paper-pr

on:
  push:
    branches: [docs/hact-journal-release-v6]
    paths:
      - "hact-paper/Adaptive_HACT_v5/paper/**"
      - ".github/workflows/hact-paper-pr-build.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended lmodern
      - name: Compile manuscript
        working-directory: hact-paper/Adaptive_HACT_v5/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
      - name: Commit compiled PDF
        run: |
          if git diff --quiet -- hact-paper/Adaptive_HACT_v5/paper/main.pdf; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hact-paper/Adaptive_HACT_v5/paper/main.pdf
          git commit -m "docs: compile HACT journal manuscript v6"
          git push origin "HEAD:${GITHUB_REF_NAME}"
