name: HACT journal extension
on:
  push:
    branches: [paper/hact-top-journal-v6]
    paths:
      - "hact-paper/Adaptive_HACT_v5/docs/V6_JOURNAL_EXPERIMENT_CONTRACT.json"
      - "hact-paper/Adaptive_HACT_v5/experiments_v6/**"
      - "hact-paper/Adaptive_HACT_v5/audit/check_v6.py"
      - ".github/workflows/hact-journal-extension.yml"
permissions:
  contents: write
jobs:
  experiment:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/hact-top-journal-v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r hact-paper/Adaptive_HACT_v5/requirements-test.txt
      - name: Run frozen study and independent audit
        working-directory: hact-paper/Adaptive_HACT_v5
        run: |
          python -m experiments_v6.journal_extension
          python -m audit.check_v6
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hact-paper/Adaptive_HACT_v5/results/v6 hact-paper/Adaptive_HACT_v5/paper/generated_v6 hact-paper/Adaptive_HACT_v5/paper/figures/v6_journal_extension.pdf
          git commit -m "research: add frozen HACT journal-extension results"
          git push origin HEAD:paper/hact-top-journal-v6
