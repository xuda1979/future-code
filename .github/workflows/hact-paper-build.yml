name: Build HACT manuscript PDF

on:
  push:
    branches:
      - paper/hact-v5-1-review-20261004
    paths:
      - "hact-paper/Adaptive_HACT_v5/paper/**"
      - ".github/workflows/hact-paper-build.yml"

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper/hact-v5-1-review-20261004
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: hact-paper/Adaptive_HACT_v5/paper
          args: -pdf -interaction=nonstopmode -halt-on-error
      - name: Commit rebuilt PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hact-paper/Adaptive_HACT_v5/paper/main.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "docs: rebuild Adaptive HACT PDF"
            git push origin HEAD:paper/hact-v5-1-review-20261004
          fi
