name: Users commercial candidates
on:
  push:
    branches: [users]
    paths: ['users/**', 'src/main.tsx', '.github/workflows/users-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commerce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test users/tests/*.test.mjs
  candidates:
    needs: commerce
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: ubuntu-x64}
          - {os: windows-latest, platform: windows-x64}
          - {os: macos-15, platform: macos-arm64}
          - {os: macos-15-intel, platform: macos-x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - run: node users/scripts/build.mjs ${{ matrix.platform }}
      - name: Test native executable, payment fulfillment, license and AI tool loop
        run: node users/scripts/native-test.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: future-code-${{ matrix.platform }}-candidate
          path: dist/users/${{ matrix.platform }}/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-code-${{ matrix.platform }}-verification
          path: dist/verification/${{ matrix.platform }}.json
          if-no-files-found: ignore
# CI artifacts are temporary candidates. users-downloads.yml promotes a pinned
# successful run into permanent, explicitly labeled preview downloads. Commercial
# sales still require rights evidence and end-to-end launch validation.
