name: Commercial source and security verification
on:
  push:
    branches: [commercial]
  pull_request:
    branches: [commercial]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Static syntax verification
        run: |
          for file in src/commercial/*.mjs tools/*.mjs scripts/*.mjs; do node --check "$file"; done
      - name: Security, protocol, activation, reporting tests
        run: node scripts/test-commercial.mjs
      - name: Swarm and provider regression tests
        run: node scripts/test-swarm.mjs
      - name: Customer CLI smoke
        run: |
          node src/commercial/app.mjs help
          node src/commercial/app.mjs provider list --state-dir "$(mktemp -d)"
          if output=$(node src/commercial/app.mjs status --root .future-code/ci-status 2>&1); then
            echo "Unexpected status success for an uninitialized harness"
            exit 1
          fi
          echo "$output" | grep -q "swarm is not initialized"
      - name: Distribution cleanliness and prohibited files
        run: node scripts/check-commercial-tree.mjs
