name: HACT journal evidence audit
on:
  pull_request:
    paths:
      - "hact-paper/Adaptive_HACT_v5/**"
      - ".github/workflows/hact-journal-evidence.yml"
permissions:
  contents: read
jobs:
  v14-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: hact-paper/Adaptive_HACT_v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore exact offline observations and verify release
        run: |
          python tools/hydrate_observations.py
          python tools/verify_manifest.py
      - name: Python dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==9.0.2 pytest-asyncio==1.3.0
      - name: Complete historical and v14 regression suite
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q -p pytest_asyncio.plugin
      - name: Historical arithmetic and current manuscript audit
        run: |
          PYTHONPATH=. python -m audit.check_v5
          PYTHONPATH=. python -m audit.numbers_audit
          PYTHONPATH=. python -m audit.check_v9
          PYTHONPATH=. python -m experiments_v10.exact_separation
          PYTHONPATH=. python -m experiments_v11.theory_generalization --full --output "$RUNNER_TEMP/hact-v11-general.json"
          PYTHONPATH=. python -m experiments_v11.strict_partition_witness
          PYTHONPATH=. python -m audit.check_v11_compiler
          PYTHONPATH=. python -m experiments_v11.report --check
          PYTHONPATH=. python -m experiments_v12.fixed_batch
          PYTHONPATH=. python -m experiments_v12.robustness --check
          PYTHONPATH=. python -m audit.check_v12
          PYTHONPATH=. python -m experiments_v12.report --check
          PYTHONPATH=. python -m experiments_v13.adoption_study --check
          PYTHONPATH=. python -m audit.check_v13
          PYTHONPATH=. python -m experiments_v13.summary_span
          PYTHONPATH=. python -m experiments_v13.report --check
          PYTHONPATH=. python -m experiments_v14.exchangeable_study --check
          PYTHONPATH=. python -m audit.check_v14
          PYTHONPATH=. python -m experiments_v14.report --check
          python tools/verify_manifest.py
      - name: Recompute service oracle and measured query trace
        run: |
          PYTHONPATH=. python -m experiments_v8.service_oracle "$RUNNER_TEMP/hact-v9-equivalence.json"
          PYTHONPATH=. python -m experiments_v8.real_query_study "$RUNNER_TEMP/hact-v9-cost-study.json"
      - name: Recompute frozen source and synthetic controls
        run: |
          PYTHONPATH=. python -m experiments_v7.strong_baselines --output "$RUNNER_TEMP/hact-v7-comparisons.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hact-v14-evidence-and-query-studies
          path: |
            ${{ runner.temp }}/hact-v9-equivalence.json
            ${{ runner.temp }}/hact-v9-cost-study.json
            ${{ runner.temp }}/hact-v7-comparisons.json
            ${{ runner.temp }}/hact-v11-general.json
          if-no-files-found: error
