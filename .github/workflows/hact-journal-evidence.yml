name: HACT journal evidence audit
on:
  pull_request:
    paths:
      - "hact-paper/Adaptive_HACT_v5/**"
      - ".github/workflows/hact-journal-evidence.yml"
permissions:
  contents: read
jobs:
  v7-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: hact-paper/Adaptive_HACT_v5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python dependencies
        run: |
          python -m pip install numpy==2.3.5 pytest==9.0.2 pytest-asyncio==1.3.0
      - name: Historical and corrected service regression gates
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python -m pytest -q tests_v7 tests_v8
      - name: Historical arithmetic and current manuscript audit
        run: |
          PYTHONPATH=. python -m audit.numbers_audit
          PYTHONPATH=. python -m audit.check_v9
          python tools/verify_manifest.py
      - name: Recompute service oracle and measured query trace
        run: |
          PYTHONPATH=. python -m experiments_v8.service_oracle "$RUNNER_TEMP/hact-v9-equivalence.json"
          PYTHONPATH=. python -m experiments_v8.real_query_study "$RUNNER_TEMP/hact-v9-cost-study.json"
      - name: Recompute frozen source and synthetic controls
        run: |
          PYTHONPATH=. python -m experiments_v7.strong_baselines --output "$RUNNER_TEMP/hact-v7-comparisons.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hact-v9-corrected-query-study
          path: |
            ${{ runner.temp }}/hact-v9-equivalence.json
            ${{ runner.temp }}/hact-v9-cost-study.json
            ${{ runner.temp }}/hact-v7-comparisons.json
          if-no-files-found: error
