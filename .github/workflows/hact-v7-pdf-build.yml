name: HACT v7 manuscript PDF build
on:
  push:
    branches: [research/hact-v7-journal-evidence]
    paths:
      - "hact-paper/Adaptive_HACT_v5/paper/**"
      - ".github/workflows/hact-v7-pdf-build.yml"
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-science texlive-pictures texlive-fonts-recommended lmodern
      - name: Compile and check manuscript
        working-directory: hact-paper/Adaptive_HACT_v5/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          if grep -q "undefined references" main.log; then
            echo "Unresolved LaTeX references" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hact-v7-journal-manuscript-pdf
          path: hact-paper/Adaptive_HACT_v5/paper/main.pdf
          if-no-files-found: error
      - name: Commit updated journal PDF to research branch
        run: |
          if git diff --quiet -- hact-paper/Adaptive_HACT_v5/paper/main.pdf; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hact-paper/Adaptive_HACT_v5/paper/main.pdf
          git commit -m "paper: compile HACT v7 journal manuscript PDF"
          git fetch origin "refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
