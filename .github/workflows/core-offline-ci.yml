name: core-offline-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain versions
        run: |
          node --version
          python3 --version
          git --version
      - name: Correctness guardrails
        run: node scripts/test-correctness.mjs
      - name: Resilience and remote-job recovery
        run: node scripts/test-resilience.mjs
      - name: Foundry kernel
        run: node scripts/test-foundry.mjs
      - name: Swarm execution
        run: node scripts/test-swarm.mjs
      - name: Command regression suite
        run: node scripts/test-commands.mjs
  api-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install minimal dependencies for API regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/api-retry" --no-audit --no-fund --ignore-scripts '@future/sdk@npm:@anthropic-ai/sdk@0.116.0' 'lodash-es@4.18.1'
          ln -s "$RUNNER_TEMP/api-retry/node_modules" node_modules
      - name: Terminal API retry regression
        run: bun test --preload ./tests/api/retry-isolation.ts ./tests/api/retry-resilience.test.ts
      - name: Auth-failure suppression regression
        run: bun test tests/correctness/auth-failure-suppression.test.ts
  terminal-sessions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install terminal runtime
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tmux
      - name: Real disconnect, reattach, proxy lifetime and exit-status regression
        env:
          FUTURE_CODE_REQUIRE_TERMINAL_TESTS: "1"
        run: python3 -m unittest discover -s tests/correctness -p test_terminal_sessions.py -v
  rendering-memory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install the rendering dependencies pinned in bun.lock
        run: |
          npm install --prefix "$RUNNER_TEMP/rendering" --no-audit --no-fund --ignore-scripts 'marked@18.0.9' '@alcalzone/ansi-tokenize@0.3.0' 'bidi-js@1.0.3' 'emoji-regex@10.6.0' 'get-east-asian-width@1.6.0' 'strip-ansi@7.2.0'
          ln -s "$RUNNER_TEMP/rendering/node_modules" node_modules
      - name: Node parser, terminal and cache regression
        run: node --experimental-strip-types --test tests/correctness/byte-bounded-cache.test.ts tests/rendering/render-cache.test.ts
      - name: Bun parser, terminal and cache regression
        run: bun test --preload ./tests/rendering/bun-isolation.ts tests/correctness/byte-bounded-cache.test.ts tests/rendering/render-cache.test.ts
      - name: Compile changed rendering sources
        run: bun build src/components/Markdown.tsx src/ink/output.ts src/ink/line-width-cache.ts src/utils/markdownLexer.ts src/utils/byteBoundedCache.ts --no-bundle --outdir "$RUNNER_TEMP/render-build"
