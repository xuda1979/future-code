name: core-offline-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Toolchain versions
        run: |
          node --version
          python3 --version
          git --version
      - name: Correctness guardrails
        run: node scripts/test-correctness.mjs
      - name: Resilience and remote-job recovery
        run: node scripts/test-resilience.mjs
      - name: Foundry kernel
        run: node scripts/test-foundry.mjs
      - name: Swarm execution
        run: node scripts/test-swarm.mjs
      - name: Command regression suite
        run: node scripts/test-commands.mjs
  api-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Install only the public SDK used by the retry boundary
        run: |
          npm install --prefix "$RUNNER_TEMP/api-retry" --no-audit --no-fund --ignore-scripts '@future/sdk@npm:@anthropic-ai/sdk@0.116.0'
          ln -s "$RUNNER_TEMP/api-retry/node_modules" node_modules
      - name: Terminal API retry regression
        run: bun test --preload ./tests/api/retry-isolation.ts ./tests/api/retry-resilience.test.ts
