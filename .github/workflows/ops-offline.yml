name: Durable ops tests
on:
  pull_request:
    paths:
      - 'src/ops/**'
      - 'tests/ops/**'
      - 'src/entrypoints/cli-bundle.ts'
      - 'src/utils/ripgrep.ts'
      - '.github/workflows/ops-offline.yml'
  workflow_dispatch:
jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ops/*.test.mjs
